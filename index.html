<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animal UI</title>
    <!-- Link the CSS file here -->
    <link rel="stylesheet" href="styles.css" />
    <!-- integrate JS file here inside the head tag -->
    <!-- <script src="app.js" defer></script> -->
  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <h1 class="header-title">
          Welcome to the Interactive Reveal What's that Animal UI
        </h1>
      </div>
    </header>
    <main class="hero-section">
      <h2 class="hero-title">
        Click on the buttons below to reveal the animal images
      </h2>
      <section class="product-card">
        <div class="card">
          <div class="card-in-cat hidden" id="cat">
            <img class="img" src="tabby-cat.jpg" />
            <button class="btn-secondary btn" id="btnSC">Hide Result</button>
          </div>
          <button class="btn-primary btn" id="btnPC">Reveal Cat</button>
        </div>
        <div class="card">
          <div class="card-in-dog hidden" id="dog">
            <img class="img" src="dog.jpg" />
            <button class="btn-secondary btn" id="btnSD">Hide Result</button>
          </div>
          <button class="btn-primary btn" id="btnPD">Reveal Dog</button>
        </div>
        <div class="card">
          <div class="card-in-cow hidden" id="cow">
            <img class="img" src="cow.jpg" />
            <button class="btn-secondary btn" id="btnSCC">Hide Result</button>
          </div>
          <button class="btn-primary btn" id="btnPCC">Reveal Cow</button>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>

  <footer></footer>
</html>
